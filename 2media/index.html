<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OnO AR Fitting</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <div id="app">


        <!-- =========================
             CAMERA
        ========================== -->

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>


        <!-- =========================
             THREE.JS
        ========================== -->

        <canvas
            id="threeCanvas">
        </canvas>


        <!-- =========================
             FACE TRACKING
        ========================== -->

        <canvas
            id="overlayCanvas">
        </canvas>


        <header id="topHeader">

            <div class="brandArea">
        
                <div class="logo">
                    <img
                        src="./images/logo.png"
                        alt="OnO">
                </div>
        
                <div class="brandTitle">
                    오앤오 안경 시착 스튜디오
                </div>
        
            </div>
        
            <button
                id="stopBtn"
                class="closeButton"
                aria-label="카메라 중지">
                ■
            </button>
        
        </header>

        <!-- =========================
             START
        ========================== -->

        <button
            id="startBtn"
            type="button">

            START

        </button>


        <!-- =========================
             MASCOT
        ========================== -->

        <div id="mascotArea">


            <div class="speechBubble">

                어떤 안경이 어울릴까?

            </div>


            <div id="mascot">

                <img
                    src="./images/mascot.png"
                    alt="OnO mascot">

            </div>

        </div>


        <!-- =========================
             GLASSES SELECTOR
        ========================== -->

        <div id="glassesUI">


            <div class="uiTitle">

                TRY ON

            </div>


            <div class="glassesList">


                <button
                    class="glassesButton active"
                    data-model="heart"
                    type="button">

                    <span class="glassesIcon">
                        ♡
                    </span>

                    <span class="glassesName">
                        Heart
                    </span>

                </button>


                <button
                    class="glassesButton"
                    data-model="round"
                    type="button">

                    <span class="glassesIcon">
                        ○
                    </span>

                    <span class="glassesName">
                        Round
                    </span>

                </button>


                <button
                    class="glassesButton"
                    data-model="cat"
                    type="button">

                    <span class="glassesIcon">
                        ⌁
                    </span>

                    <span class="glassesName">
                        Cat
                    </span>

                </button>


                <button
                    class="glassesButton"
                    data-model="black"
                    type="button">

                    <span class="glassesIcon">
                        ●
                    </span>

                    <span class="glassesName">
                        Black
                    </span>

                </button>


                <button
                    class="glassesButton"
                    data-model="classic"
                    type="button">

                    <span class="glassesIcon">
                        □
                    </span>

                    <span class="glassesName">
                        Classic
                    </span>

                </button>


            </div>

        </div>


    </div>


    <!-- =========================
         MEDIAPIPE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


    <!-- =========================
         THREE.JS
    ========================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


    <!-- =========================
         JS
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
